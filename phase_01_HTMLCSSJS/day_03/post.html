<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            height: 500px;
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 4px, rgba(0, 0, 0, 0.3) 0px 7px 13px -3px, rgba(0, 0, 0, 0.2) 0px -3px 0px inset;
        }
        .btn{
            display: flex;
            gap: 10px;
        }
        button{
            width: 70px;
            font-size: xx-large;
        }
        img{
            height: 250px;
            width: 250px;
        }
        button:hover{
            cursor: pointer;
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <div id="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Shah_Rukh_Khan_graces_the_launch_of_the_new_Santro.jpg" alt="">
        <h3>King Khan</h3>
        <div class="btn">
            <button id="likeButton">👍</button>
            <h3>Likes: <span id="lcount">0</span></h3>
        </div>
        <div class="btn">
            <button id="dislikeButton">👎</button>
            <h3>Dislikes: 0</h3>
        </div>
    </div>
</body>
</html>
<script>

    var button=document.getElementById("likeButton")
    var count=0
    button.addEventListener("click",function(){
        
        count+=1
        var lCount=document.getElementById("lcount")
        // console.log(lCount)
        // <span>0<span>
        lCount.innerText=count
    })

</script>
