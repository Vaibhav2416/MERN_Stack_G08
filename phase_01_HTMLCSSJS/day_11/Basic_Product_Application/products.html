<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div>
            <h1>Welcome to Product Page</h1>
            <h3 id="username">User : </h3>
            <button onclick="handleLogout()">Logout</button>
            <a href="cart.html">Cart Page</a>
            <div id="cards">

            </div>
        </div>
        
    </div>
    <div id="falseUser">
        
    </div>
</body>
</html>
<script>
    // check first whether user is logged in or not
    let check_status=sessionStorage.getItem("isLoggedIn")
    let container=document.getElementById("container")
    let falseUser=document.getElementById("falseUser")
    let username=document.getElementById("username")
    let currentuser=JSON.parse(sessionStorage.getItem("current_user"))
    let cards=document.getElementById("cards")

    console.log(check_status)
    if(check_status=="true"){
        username.innerHTML=`<h3>User:${currentuser.name}</h3>`
        container.style.display="block" // show content
    }else{
        container.style.display="none" // hides content
        falseUser.innerHTML=`<h1>Please login first</h1>
        <a href="login.html">Click here to login</a>`
    }

    let handleLogout=()=>{
        sessionStorage.removeItem("isLoggedIn")
        window.location.reload()
    }
    // api ==> fetch

    // session storage ==> your data will be stored till current session
    // means till browser or tab closes

    async function fetchData(){
        let resp=await fetch("https://dummyjson.com/products")
        let data=await resp.json()
        let products=data.products
        localStorage.setItem("products",JSON.stringify(products))

        products.forEach(element => {
            cards.innerHTML+=`
            <h3>${element.title}</h3>
            <img height="200px" src="${element.images[0]}">
            <button onclick="handleCart(${element.id})">Add to Cart</button>
            `
        });
    }
    fetchData()

    function handleCart(id){
        // alert(`clicked ${id}`)
        // all products will be here == filter for getting clicked
        let all_products=JSON.parse(localStorage.getItem("products"))
        
        let cartItem=all_products.find((el)=>el.id==id)
        // [{id:1,title:"Mascara"},{id:2,title:"item 2"}] == 1
        // cartItem = {id:1,title:"Mascara"}
        let array=JSON.parse(localStorage.getItem("cart")) || []
        array.push(cartItem)
        localStorage.setItem("cart",JSON.stringify(array))
    }

</script>
