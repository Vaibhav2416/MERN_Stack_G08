<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
    
<div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Sign Up Page</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="text"
              id="password"
              class="form-control mb-3"
              placeholder="Enter Password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>
</body>
</html>
<script>
    let users_array=[] 
    let handleSubmit=(event)=>{
        event.preventDefault() // to stop auto refreshing of browser after submitting
        
        let name=document.getElementById("name")
        let email=document.getElementById("email")
        let password=document.getElementById("password")

        let user={
            name:name.value,
            email:email.value,
            pass:password.value
        }
        // [{name:"aman",email:"aman@email.com",pass:"123"},{name:"naman",email:"naman@email.com",pass:"123"}]
        // we will check first that we have any local storage data of users
        // if yes then we will just push our new object in existing array

        // checking users
        let users_data=localStorage.getItem("users") // [lalit]
        console.log("users in local storage",users_data)
        if(users_data==null){
            users_array=[]
        }
        else{
            users_array=JSON.parse(users_data) // [lalit,aman]
        }
        let userexist=users_array.some((el)=>el.email==email.value)
        console.log(userexist)
        if(userexist) return alert("User Already Exists")
        // [{name:"aman",email:"aman@email.com",pass:123}]
        // some ==> will return boolean value according to searching
        //          wanted to user
        users_array.push(user)

        // users_array ==> some function ==> check entered email is 
        // present already or not
      
        
        localStorage.setItem("users",JSON.stringify(users_array))

        window.location.href="login.html"
    }
  // localstorage => feature of web browser which allows you to store
  // data permanently in local system
  // Signup => login => products.html
</script>
