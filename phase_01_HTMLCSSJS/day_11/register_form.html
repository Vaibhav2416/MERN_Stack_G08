<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Card</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Student Registration</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="number"
              id="age"
              class="form-control mb-3"
              placeholder="Enter Age"
              required
            >

            <input
              type="text"
              id="course"
              class="form-control mb-3"
              placeholder="Enter Course"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>

<script>
let form = document.getElementById("studentForm");
let output = document.getElementById("output");

let handleSubmit=(event)=>{

    event.preventDefault();

    // Create Object
    let student = {
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        course: document.getElementById("course").value
    };
    // {name:"Aman",age:28,course:"Java"}
    let json_student=JSON.stringify(student)
    // {"name::"Aman","age":28,"course":"Java"}
    // store this object in db/localstorage
    localStorage.setItem("records",json_student)

    console.log(student);
    // Display Card using object properties

    form.reset();
}

let renderFunction=()=>{
    let get_data=localStorage.getItem("records")
    
    let student=JSON.parse(get_data) // string =>object
    console.log(student)
    console.log(typeof(student))
    output.innerHTML = `
        <div class="student-card">
            <h3 class="text-primary mb-3">${student.name}</h3>
            <p><strong>Age:</strong> ${student.age}</p>
            <p><strong>Course:</strong> ${student.course}</p>
        </div>
    `;
} 


renderFunction()


</script>

</body>
</html>
