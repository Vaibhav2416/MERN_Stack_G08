<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
    <div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Sign Up</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="text"
              id="password"
              class="form-control mb-3"
              placeholder="Enter Password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>
    
</body>
</html>
<script>
    let array=[]
    let handleSubmit=(event)=>{
        event.preventDefault() // to stop autorefreshing of browser
        
        let name=document.getElementById("name")
        let email=document.getElementById("email")
        let password=document.getElementById("password")

        let user={
            username:name.value,
            useremail:email.value,
            userpassword:password.value
        }
        // console.log(user)
        // {"key":user}
        let check_data=localStorage.getItem("users") // string  // 1st time --> 
        console.log(check_data)
        // [{name:"kartik",email:"kartik@gmail.com"}]
        if(check_data==null){
            array=[]
        }
        else{
            array=JSON.parse(check_data)
        }
        // [{name:"kartik",email:"kartik@gmail.com"},{name:"sanket",email:"sanket@gmail.com"}]]
        // some method will return boolean value according to 
        // specified condition
        let check_user= array.some((el)=>el.useremail==email.value)
        if(check_user) return alert("User already exists")

        array.push(user)
        // {"students":{"username":"aman","email":"aman@email.com"}}
        // {"students":[{"username":"aman","email":"aman@email.com"},{"username":"prateek","email":"prateek@email.com"}]}
        let storage=localStorage.setItem("users",JSON.stringify(array))

        window.location.href="login.html"
    }
// sign up ==> storing multiple users in ls
// login ==> verify users
// products page
</script>
